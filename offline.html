<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#345c49">
  <title>غير متصل - أكاديمي</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: #e8e8e8;
      color: #345c49;
      font-family: Tahoma, Arial, sans-serif;
      text-align: center;
    }
    main { width: min(100%, 420px); }
    h1 { margin: 0 0 12px; font-size: 26px; }
    p { margin: 0; line-height: 1.8; }
  </style>
</head>
<body>
  <main>
    <h1>ماكو اتصال بالإنترنت</h1>
    <p>اتصل بالإنترنت وحاول تفتح الصفحة مرة ثانية.</p>
  </main>
</body>
</html>
